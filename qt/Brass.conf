# Brass colour scheme for qt5ct / qt6ct, part of cosmic-brass-theme (MIT).
# The rice's window colour for windows, its containers for buttons and
# tooltips, its text colour, the accent as highlight with the button text
# colour on it, dim placeholders.
#
# Install: ./qt/install.sh puts this in ~/.config/qt5ct/colors/ and
# ~/.config/qt6ct/colors/. Then in qt5ct / qt6ct: Appearance -> Color scheme
# -> Brass, Palette: Custom, Apply. Qt apps need QT_QPA_PLATFORMTHEME=qt5ct
# (or qt6ct) in the environment to read it.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#f0e4c5, #232220, #6b655c, #3a3631, #161412, #2c2925, #f0e4c5, #fff8e8, #f0e4c5, #161412, #1c1b19, #161412, #d4bd99, #1c1b19, #d4bd99, #e0905c, #232220, #1c1b19, #232220, #f0e4c5, #8e8373
disabled_colors=#6b655c, #232220, #6b655c, #3a3631, #161412, #2c2925, #6b655c, #a89984, #6b655c, #1c1b19, #1c1b19, #161412, #6b655c, #a89984, #8e8373, #8e8373, #232220, #1c1b19, #232220, #f0e4c5, #6b655c
inactive_colors=#f0e4c5, #232220, #6b655c, #3a3631, #161412, #2c2925, #f0e4c5, #fff8e8, #f0e4c5, #161412, #1c1b19, #161412, #d4bd99, #1c1b19, #d4bd99, #e0905c, #232220, #1c1b19, #232220, #f0e4c5, #8e8373
